# Lint, the reference verifier against the committed corpus, and — the
# step that makes this more than a unit-test job — the *published*
# sources verified against the published anchor. A commit that breaks a
# signature, lets a document expire or leaves a part unhashed fails here
# rather than in somebody's build.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-pytest:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q

      - name: The catalogue must match the declared sources
        # sources.json is generated; a stale one is a directory that lies.
        run: |
          python -m mcuhome.packagetool catalog
          git diff --exit-code sources.json

      - name: Verify the published sources
        # Every source publishing.json declares, so adding one needs no
        # workflow change.
        run: |
          for source in $(jq -r '.sources | keys[]' publishing.json); do
            python verify.py "$source" --anchor anchor.json
          done

      - name: Report remaining validity
        # Fails when a document is closer to expiry than its warning
        # threshold — for keys.json that is the signal to arrange a root
        # ceremony, which nothing automatic can do.
        run: |
          python -m mcuhome.packagetool status \
            --source $(jq -r '.sources | keys[]' publishing.json | tr '\n' ' ')

  license-reuse:
    name: License (reuse)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --disable-pip-version-check reuse==5.0.2

      - name: reuse lint
        run: reuse lint

  spell-codespell:
    name: Spelling (codespell)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --disable-pip-version-check codespell==2.4.3

      # The ignored words are deliberate spellings, not slips: Requestor and
      # PASE are the Matter specification's own, OT is OpenThread, rsource is
      # Kconfig's. Generated documents and patches are skipped because their
      # wording is not ours to correct.
      - name: codespell
        run: codespell --ignore-words-list=requestor,pase,ot,rsource,re-declared,re-declare,re-used,unparseable,pre-empt --skip='./.git,./frontend/node_modules,*.matter,*.zap,pnpm-lock.yaml,*.patch'

  hygiene-prehooks:
    name: Hygiene (pre-commit-hooks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --disable-pip-version-check pre-commit-hooks==5.0.0

      # The fixers rewrite and exit non-zero when they had to; in CI the tree
      # is throwaway, so that is exactly a check. `patches/` is excluded on
      # purpose: a context line in a unified diff is a single space, and
      # stripping it produces a patch that no longer applies.
      - name: Whitespace, final newline and line endings
        run: |
          text=$(git grep -Il '' -- . ':!patches/**' ':!*.patch' ':!*.matter' ':!*.zap')
          trailing-whitespace-fixer $text
          end-of-file-fixer $text
          mixed-line-ending --fix=no $text

      - name: No merge markers
        run: check-merge-conflict $(git grep -Il '' -- .)

      # --unsafe checks the syntax and not the tags: this project has its own
      # (`!secret`, `!file`), and a loader that refuses them is not a finding.
      - name: YAML parses
        run: |
          files=$(git ls-files '*.yml' '*.yaml')
          if [ -n "$files" ]; then check-yaml --unsafe $files; fi

  commits-conventional:
    name: Commits (conventional)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --disable-pip-version-check conventional-pre-commit==4.0.0

      # Merge commits carry GitHub's wording, not ours, so they are skipped.
      - name: Every commit message states its kind
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE" ]; then
            range="$BASE..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..${{ github.sha }}"
          else
            range="HEAD~1..HEAD"
          fi
          status=0
          for sha in $(git log --no-merges --format=%H "$range"); do
            git log -1 --format=%B "$sha" > /tmp/commit-message
            conventional-pre-commit /tmp/commit-message || { echo "  ^ $sha"; status=1; }
          done
          exit $status
